plugins {
    id 'com.android.application'
    id 'kotlin-android'
}
android {
    namespace 'com.gamesidebar'
    compileSdk 34
    defaultConfig {
        // DO NOT CHANGE package/application ID - preserve existing
        applicationId "com.gamesidebar"
        minSdk 23
        targetSdk 34
        versionCode 202
        versionName "Master Bugfix V2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.browser:browser:1.7.0' // CustomTabs for safe auth
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
}
