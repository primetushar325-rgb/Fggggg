name: Build APK - Master Bugfix V2

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Apply patches (if patches/ exists)
        run: |
          if [ -d patches ]; then
            for p in patches/*.patch; do
              [ -f "$p" ] || continue
              echo "Checking patch $p"
              git apply --check "$p" && git am < "$p" || echo "patch apply failed or already applied: $p"
            done
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace || echo "release build skipped"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: game-sidebar-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: game-sidebar-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: APK info
        run: |
          ls -lh app/build/outputs/apk/debug/ || true
          echo "APK output path: app/build/outputs/apk/debug/app-debug.apk"
