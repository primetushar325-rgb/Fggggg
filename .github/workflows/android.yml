name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      # On failure, surface Kotlin compile errors as annotations (readable via the API & UI).
      - name: Report compile errors
        if: failure()
        run: |
          ./gradlew :app:compileDebugKotlin --console=plain > compile.log 2>&1 || true
          grep -E "^e: " compile.log | head -60 | sed -E 's|^e: file://[^ ]*/(app/[^:]+:)|::error::\1|' || true

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamesoundpro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Opt-in release builds. Configure these repository secrets first (see docs/RELEASE.md):
  #   GSP_KEYSTORE_BASE64, GSP_KEYSTORE_PASSWORD, GSP_KEY_ALIAS, GSP_KEY_PASSWORD
  # then push a tag like v1.0.0 (or run this job via workflow_dispatch on a tag).
  release:
    name: Signed release APK (tag builds)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore and build signed release
        env:
          GSP_KEYSTORE_BASE64: ${{ secrets.GSP_KEYSTORE_BASE64 }}
          GSP_KEYSTORE_PASSWORD: ${{ secrets.GSP_KEYSTORE_PASSWORD }}
          GSP_KEY_ALIAS: ${{ secrets.GSP_KEY_ALIAS }}
          GSP_KEY_PASSWORD: ${{ secrets.GSP_KEY_PASSWORD }}
        run: |
          if [ -z "$GSP_KEYSTORE_BASE64" ]; then
            echo "GSP_KEYSTORE_BASE64 secret is not configured; building an UNSIGNED release APK."
          else
            echo "$GSP_KEYSTORE_BASE64" | base64 -d > release.keystore
            export GSP_KEYSTORE_PATH=release.keystore
          fi
          ./gradlew :app:assembleRelease --stacktrace

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamesoundpro-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
