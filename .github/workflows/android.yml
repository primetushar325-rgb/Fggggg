name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace 2>&1 | tee build.log

      # On failure, surface Kotlin compile errors / task failures as annotations.
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: " build.log | head -60 | sed -E 's|^e: file://[^ ]*/(app/[^:]+:)|::error::\1|' || true
          grep -E "(^|>) Task .*FAILED|Execution failed for task|\* What went wrong|FAILED$|Caused by:" build.log | head -30 | sed 's/^/::error::/' || true
          grep -B2 -A8 "There were failing tests" build.log | head -40 | sed 's/^/::error::/' || true

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamesoundpro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Opt-in release builds. Configure these repository secrets first (see docs/RELEASE.md):
  #   GSP_KEYSTORE_BASE64, GSP_KEYSTORE_PASSWORD, GSP_KEY_ALIAS, GSP_KEY_PASSWORD
  # then push a tag like v1.0.0 (or run this job via workflow_dispatch on a tag).
  release:
    name: Signed release APK (tag builds)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore and build signed release
        env:
          GSP_KEYSTORE_BASE64: ${{ secrets.GSP_KEYSTORE_BASE64 }}
          GSP_KEYSTORE_PASSWORD: ${{ secrets.GSP_KEYSTORE_PASSWORD }}
          GSP_KEY_ALIAS: ${{ secrets.GSP_KEY_ALIAS }}
          GSP_KEY_PASSWORD: ${{ secrets.GSP_KEY_PASSWORD }}
        run: |
          if [ -z "$GSP_KEYSTORE_BASE64" ]; then
            echo "GSP_KEYSTORE_BASE64 secret is not configured; building an UNSIGNED release APK."
          else
            echo "$GSP_KEYSTORE_BASE64" | base64 -d > release.keystore
            export GSP_KEYSTORE_PATH=release.keystore
          fi
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace 2>&1 | tee release-build.log

      - name: Report release build errors
        if: failure()
        run: |
          grep -E "^e: " release-build.log | head -60 | sed -E 's|^e: file://[^ ]*/(app/[^:]+:)|::error::\1|' || true
          grep -E "Missing class|Execution failed for task|\* What went wrong|Caused by:|Warning: " release-build.log | head -40 | sed 's/^/::error::/' || true

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamesoundpro-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Commit the built APKs into the working branch so they can be downloaded
      # without signing in to GitHub (raw links + normal git clone both work).
      - name: Deliver APKs to the repository
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk "apk/GameSoundPro-${GITHUB_REF_NAME}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "apk/GameSoundPro-${GITHUB_REF_NAME}-release.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "apk/GameSoundPro-${GITHUB_REF_NAME}-release-unsigned.apk"
          fi
          git add apk
          git commit -m "APK delivery ${GITHUB_REF_NAME} [skip ci]"
          git push origin "HEAD:arena/01a08240-fggggg"
